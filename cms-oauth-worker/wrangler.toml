name = "disegni-cms-oauth"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[vars]
SMARTBEE_TEST_API_BASE = "https://test.smartbee.co.il/api/v1"
SMARTBEE_ALLOWED_ORIGINS = "https://disegni.studio,https://www.disegni.studio"

# Order status storage for the Grow checkout flow (created/pending/paid/...).
# Create once with: npx wrangler kv namespace create ORDERS_KV
# then replace the id below with the id it prints out. See README.md.
[[kv_namespaces]]
binding = "ORDERS_KV"
id = "07604581ca9f48d089a1067b00df4dce"
