backend:
  name: github
  repo: galdisegniart/disegni-studio
  branch: main
  base_url: https://disegni-cms-oauth.galdisegniart.workers.dev

local_backend: true

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "artworks"
    label: "יצירות אמנות (גלריה)"
    folder: "src/content/artworks"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.slug}}"
    identifier_field: "name"
    summary: "{{name}} ({{galleryMedium}})"
    fields:
      - { label: "מזהה בכתובת (אנגלית, ללא רווחים)", name: "slug", widget: "string", hint: "משמש בכתובת /products/<מזהה>/ - לא לשנות אחרי הפרסום" }
      - { label: "סדר הופעה בגלריה", name: "order", widget: "number" }
      - { label: "שם היצירה", name: "name", widget: "string" }
      - { label: "קטגוריה (טכניקה)", name: "category", widget: "string", hint: "הקלידו באנגלית, ללא רווחים (למשל pastel, mixed, acrylic, drawing, oil, digital). חייב להתאים בדיוק לערך (value) של אחד מכפתורי הסינון בעמוד 'הדפסים' (תוכן החנות > הדפסים) - אחרת היצירה לא תופיע כשמסננים לפי אותה קטגוריה." }
      - { label: "טכניקה (מוצג בגלריה ובחנות)", name: "galleryMedium", widget: "string" }
      - { label: "טכניקה (מוצג בעמוד היצירה)", name: "detailMedium", widget: "string" }
      - { label: "תיאור היצירה", name: "description", widget: "text" }
      - { label: "טקסט חלופי לתמונה (נגישות)", name: "alt", widget: "string" }
      - { label: "תמונה בגודל מלא", name: "image", widget: "image" }
      - { label: "תמונה ממוזערת (גלריה)", name: "thumb", widget: "image" }
      - label: "תמונות נוספות בעמוד המוצר"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "תמונה", name: "image", widget: "image" }
          - { label: "תמונה ממוזערת (אופציונלי)", name: "thumb", widget: "image", required: false }
          - { label: "טקסט חלופי לתמונה", name: "alt", widget: "string" }
          - { label: "סוג מוצר מקושר (אופציונלי)", name: "productType", widget: "select", required: false, options: [{ label: "פוסטר", value: "poster" }, { label: "קנבס מתוח", value: "canvas" }, { label: "פוסטר ממוסגר", value: "framed-print" }] }
          - { label: "מידה מקושרת באינץ' (אופציונלי, לדוגמה 12x16)", name: "sizeId", widget: "string", required: false }
          - { label: "צבע מסגרת (אופציונלי)", name: "frameColor", widget: "select", required: false, options: [{ label: "שחור", value: "black" }, { label: "לבן", value: "white" }, { label: "עץ", value: "wood" }] }
      - { label: "היצירה המקורית זמינה למכירה?", name: "originalAvailable", widget: "boolean", default: false, hint: "סמנו רק אם המקור עדיין לא נמכר ואתם רוצים למכור אותו" }
      - { label: "מחיר היצירה המקורית (₪)", name: "originalPrice", widget: "number", default: 0, hint: "רלוונטי רק אם סימנתם 'זמינה למכירה' למעלה" }
      - name: "handEmbellished"
        label: "הדפס בעיטור ידני (אופציונלי)"
        widget: "object"
        required: false
        fields:
          - { label: "מוצע ליצירה הזו?", name: "available", widget: "boolean", default: false }
          - { label: "מחיר (₪)", name: "price", widget: "number", required: false }
          - { label: "תיאור הגודל (למשל '16×20 קנבס מתוח')", name: "sizeLabel", widget: "string", required: false }
      - name: "story"
        label: "הסיפור מאחורי היצירה (אופציונלי, השאירו ריק כדי לא להציג)"
        widget: "object"
        required: false
        fields:
          - { label: "כותרת", name: "heading", widget: "string", required: false }
          - { label: "פסקאות", name: "paragraphs", widget: "list", required: false, field: { label: "פסקה", name: "text", widget: "text" } }
      - name: "testimony"
        label: "עדות על היצירה (אופציונלי, השאירו ריק כדי לא להציג)"
        widget: "object"
        required: false
        fields:
          - { label: "כותרת", name: "heading", widget: "string", required: false }
          - { label: "טקסט העדות", name: "text", widget: "text", required: false }
          - name: "video"
            label: "סרטון (אופציונלי)"
            widget: "object"
            required: false
            fields:
              - { label: "קובץ וידאו", name: "file", widget: "file", required: false, hint: "העלו קובץ mp4" }
              - { label: "תמונת שער לסרטון (אופציונלי)", name: "poster", widget: "image", required: false }
              - { label: "כיתוב (אופציונלי)", name: "caption", widget: "string", required: false }
      - label: "סוגי הדפסה נוספים (חוץ מנייר, שזמין תמיד)"
        name: "extraMaterials"
        widget: "select"
        multiple: true
        required: false
        default: []
        hint: "סמנו רק אחרי שהוספתם את היצירה כמוצר מתאים בפרינטפול, אחרת ההזמנה לא תעבוד"
        options:
          - { label: "קנבס מתוח", value: "canvas" }
          - { label: "פוסטר ממוסגר", value: "framed-print" }

  - name: "workshops"
    label: "סדנאות"
    folder: "src/content/workshops"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.slug}}"
    identifier_field: "cardTitle"
    summary: "{{cardTitle}}"
    fields:
      - { label: "מזהה בכתובת (אנגלית, ללא רווחים)", name: "slug", widget: "string", hint: "משמש בכתובת /workshops/<מזהה>/ - לא לשנות אחרי הפרסום" }
      - { label: "סדר הופעה", name: "order", widget: "number" }
      - { label: "כותרת קצרה בכרטיס", name: "cardLabel", widget: "string" }
      - { label: "שם הסדנה בכרטיס", name: "cardTitle", widget: "string" }
      - { label: "תמונת כרטיס", name: "cardImage", widget: "image" }
      - { label: "טקסט חלופי לתמונת כרטיס", name: "cardImageAlt", widget: "string" }
      - { label: "משפט קצר: למי הסדנה מתאימה (מוצג בעמוד רשימת הסדנאות)", name: "personaLine", widget: "string", required: false }
      - { label: "כותרת הדפדפן (title)", name: "title", widget: "string" }
      - { label: "תיאור למנועי חיפוש", name: "metaDescription", widget: "text" }
      - { label: "כיתוב קטן מעל הכותרת", name: "eyebrow", widget: "string" }
      - { label: "כותרת ראשית", name: "heading", widget: "string" }
      - { label: "טקסט פתיחה", name: "lead", widget: "text" }
      - { label: "מחיר החל מ- (₪, מספר בלבד - לשימוש בנתונים מובנים ל-Google)", name: "priceFromILS", widget: "number" }
      - name: "quickMeta"
        label: "פרטים מהירים (4 שדות)"
        widget: "list"
        fields:
          - { label: "תווית", name: "label", widget: "string" }
          - { label: "ערך", name: "value", widget: "string" }
      - { label: "טקסט כפתור פעולה ראשי", name: "heroCtaLabel", widget: "string" }
      - { label: "הודעת WhatsApp (כפתור ראשי)", name: "waMessage", widget: "text" }
      - { label: "תמונה ראשית", name: "heroImage", widget: "image" }
      - { label: "טקסט חלופי לתמונה ראשית", name: "heroImageAlt", widget: "string" }
      - { label: "יש ביקורות אמיתיות?", name: "hasReviews", widget: "boolean", default: false }
      - { label: "ציטוט קצר לתקציר ביקורת (אם יש ביקורות)", name: "reviewPeekExcerpt", widget: "string", required: false }
      - name: "story"
        label: "סקציית הסיפור"
        widget: "object"
        fields:
          - { label: "כיתוב קטן", name: "eyebrow", widget: "string" }
          - { label: "כותרת (אפשר <br> לשבירת שורה)", name: "heading", widget: "string" }
          - { label: "פסקת פתיחה מודגשת", name: "lead", widget: "string" }
          - { label: "פסקאות נוספות", name: "paragraphs", widget: "list", field: { label: "פסקה", name: "text", widget: "text" } }
      - name: "video"
        label: "סקציית וידאו (השאירו ריק אם אין)"
        widget: "object"
        required: false
        fields:
          - { label: "כיתוב קטן", name: "eyebrow", widget: "string" }
          - { label: "כותרת", name: "heading", widget: "string" }
          - { label: "טקסט", name: "text", widget: "string" }
          - { label: "תמונת שער", name: "poster", widget: "image" }
          - { label: "טקסט חלופי לתמונת השער", name: "posterAlt", widget: "string" }
      - name: "included"
        label: "מה כלול"
        widget: "object"
        fields:
          - { label: "כיתוב קטן", name: "eyebrow", widget: "string" }
          - name: "items"
            label: "פריטים (4)"
            widget: "list"
            fields:
              - { label: "תווית", name: "label", widget: "string" }
              - { label: "כותרת", name: "title", widget: "string" }
              - { label: "טקסט", name: "text", widget: "text" }
      - name: "pricing"
        label: "מחירים"
        widget: "object"
        fields:
          - { label: "כיתוב קטן", name: "eyebrow", widget: "string" }
          - { label: "כותרת", name: "heading", widget: "string" }
          - { label: "הערה", name: "note", widget: "text" }
          - name: "tiers"
            label: "שורות מחיר"
            widget: "list"
            fields:
              - { label: "תווית", name: "label", widget: "string" }
              - { label: "מחיר", name: "value", widget: "string" }
          - { label: "טקסט כפתור", name: "ctaLabel", widget: "string" }
      - name: "gallery"
        label: "גלריית תמונות (השאירו ריק אם אין)"
        widget: "object"
        required: false
        fields:
          - { label: "כיתוב קטן", name: "eyebrow", widget: "string" }
          - { label: "טקסט כפתור הרחבה (ריק = בלי הרחבה)", name: "expandLabel", widget: "string", required: false }
          - name: "images"
            label: "תמונות"
            widget: "list"
            fields:
              - { label: "תמונה", name: "src", widget: "image" }
              - { label: "טקסט חלופי", name: "alt", widget: "string" }
              - { label: "תמונה רחבה (רק לתמונה ראשונה)", name: "wide", widget: "boolean", required: false, default: false }
      - name: "reviewsHeading"
        label: "כותרת סקציית הביקורות"
        widget: "object"
        fields:
          - { label: "כיתוב קטן", name: "eyebrow", widget: "string" }
          - { label: "כותרת", name: "heading", widget: "string" }
      - name: "reviewsSummary"
        label: "סיכום דירוג (רק אם יש ביקורות)"
        widget: "object"
        required: false
        fields:
          - { label: "ציון", name: "score", widget: "string" }
          - { label: "טקסט כמות", name: "countLabel", widget: "string" }
      - { label: "טקסט כשאין ביקורות עדיין", name: "reviewsEmptyText", widget: "string", required: false }
      - name: "reviews"
        label: "ביקורות"
        widget: "list"
        required: false
        fields:
          - { label: "שם", name: "name", widget: "string" }
          - { label: "תאריך (YYYY-MM-DD)", name: "date", widget: "string" }
          - { label: "תאריך לתצוגה", name: "dateLabel", widget: "string" }
          - { label: "תקציר", name: "excerpt", widget: "string" }
          - { label: "ביקורת מלאה", name: "full", widget: "text" }
      - { label: "כיתוב קטן (סיום)", name: "finalEyebrow", widget: "string" }
      - { label: "כותרת סיום", name: "finalHeading", widget: "string" }
      - { label: "טקסט כפתור סיום", name: "finalCtaLabel", widget: "string" }
      - { label: "הודעת WhatsApp (כפתור סיום)", name: "finalWaMessage", widget: "text" }

  - name: "homeAndSettings"
    label: "דף הבית והגדרות כלליות"
    files:
      - name: "home"
        label: "עמוד הבית (ראשי)"
        file: "src/content/pages/home.json"
        fields:
          - { label: "כותרת הדפדפן (title)", name: "title", widget: "string" }
          - { label: "תיאור למנועי חיפוש", name: "metaDescription", widget: "text" }
          - { label: "תמונת הירו", name: "heroImage", widget: "image" }
          - { label: "טקסט חלופי לתמונה", name: "heroImageAlt", widget: "string" }
          - { label: "כותרת - שורה 1", name: "headingLine1", widget: "string" }
          - { label: "כותרת - שורה 2", name: "headingLine2", widget: "string" }
          - { label: "טקסט פתיחה", name: "leadText", widget: "text" }
          - { label: "שורת הבטחה 1", name: "assuranceLine1", widget: "string" }
          - { label: "שורת הבטחה 2", name: "assuranceLine2", widget: "string" }
          - { label: "טקסט נגישות לסקציית הכרטיסיות", name: "gatesAriaLabel", widget: "string" }
          - { label: "כותרת מעל גלריית הציורים", name: "galleryHeading", widget: "string" }
          - name: "gates"
            label: "ארבע הכניסות המסחריות"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "כותרת", name: "label", widget: "string" }
              - { label: "תמונת הכרטיס", name: "image", widget: "image", hint: "התמונה שתוצג בכרטיס הקטגוריה בעמוד הראשי" }
              - { label: "טקסט חלופי לתמונה", name: "alt", widget: "string", required: false }
              - { label: "מיקום התמונה בחיתוך (object-position, למשל 'center' או 'top')", name: "imagePosition", widget: "string", required: false }
              - { label: "כתובת הכפתור", name: "href", widget: "string" }
              - { label: "טקסט הכפתור", name: "ctaLabel", widget: "string" }
              - { label: "להציג בעמוד הבית", name: "visible", widget: "boolean", default: true }

      - name: "settings"
        label: "הגדרות אתר כלליות"
        file: "src/_data/site.json"
        fields:
          - { label: "שם המותג", name: "brand", widget: "string" }
          - { label: "תיאור קצר (בפוטר)", name: "tagline", widget: "string" }
          - { label: "מספר וואטסאפ (בפורמט בינלאומי, ללא + או רווחים, לדוגמה 972501234567)", name: "whatsappNumber", widget: "string" }
          - { label: "מספר עוסק (פטור/מורשה)", name: "businessNumber", widget: "string", required: false, hint: "יוצג בתחתית האתר. השאירו ריק כדי לא להציג" }
          - { label: "קישור עמוד יצירת קשר", name: "contactHref", widget: "string", hint: "לא לשנות בלי סיבה טובה - נתיב פנימי באתר" }
          - name: "nav"
            label: "תפריט ניווט"
            widget: "list"
            hint: "זהירות: שינוי כתובת (href) עלול לשבור קישור בתפריט. שינוי טקסט (label) בטוח."
            fields:
              - { label: "טקסט בתפריט", name: "label", widget: "string" }
              - { label: "כתובת", name: "href", widget: "string" }
              - { label: "להציג בתפריט", name: "visible", widget: "boolean", default: true }
              - name: "children"
                label: "תת-תפריט"
                widget: "list"
                required: false
                fields:
                  - { label: "טקסט בתפריט", name: "label", widget: "string" }
                  - { label: "כתובת", name: "href", widget: "string" }
                  - { label: "להציג בתפריט", name: "visible", widget: "boolean", default: true }
          - name: "socials"
            label: "רשתות חברתיות"
            widget: "list"
            hint: "הסדר קבוע: אינסטגרם, טיקטוק, פייסבוק - לא לשנות את הסדר"
            fields:
              - { label: "שם הרשת", name: "name", widget: "string" }
              - { label: "קישור", name: "href", widget: "string" }

  - name: "shopContent"
    label: "תוכן החנות (מחירים, הדפסים, מקוריות)"
    files:
      - name: "prints"
        label: "קולקציה: הדפסים (/collections/prints/)"
        file: "src/content/pages/prints.json"
        fields:
          - { label: "כותרת הדפדפן (title)", name: "title", widget: "string" }
          - { label: "תיאור למנועי חיפוש", name: "metaDescription", widget: "text" }
          - { label: "כותרת ראשית", name: "heading", widget: "string" }
          - { label: "טקסט פתיחה", name: "heroText", widget: "text" }
          - { label: "טקסט קישור ליצירות המקוריות", name: "originalsLinkLabel", widget: "string" }
          - { label: "כותרת סקציית היצירות", name: "catalogHeading", widget: "string" }
          - { label: "תווית מסנן: הכל", name: "filterAllLabel", widget: "string" }
          - name: "filters"
            label: "כפתורי סינון לפי קטגוריה"
            widget: "list"
            hint: "הוסיפו כפתור לכל קטגוריה (טכניקה) שיש לכם. ה'ערך' (value) חייב להיות זהה בדיוק לשדה 'קטגוריה' שהזנתם ביצירות (באנגלית, ללא רווחים) - אחרת הכפתור לא יראה יצירות."
            fields:
              - { label: "טקסט הכפתור (עברית)", name: "label", widget: "string" }
              - { label: "ערך (אנגלית, ללא רווחים - למשל pastel)", name: "value", widget: "string" }

      - name: "originals"
        label: "קולקציה: מקוריות זמינות (/collections/originals/)"
        file: "src/content/pages/originals.json"
        fields:
          - { label: "כותרת הדפדפן (title)", name: "title", widget: "string" }
          - { label: "תיאור למנועי חיפוש", name: "metaDescription", widget: "text" }
          - { label: "כותרת ראשית", name: "heading", widget: "string" }
          - { label: "טקסט פתיחה", name: "heroText", widget: "text" }

      - name: "pricing"
        label: "מחירון הדפסים"
        file: "src/content/pages/pricing.json"
        fields:
          - name: "materials"
            label: "סוגי הדפסה"
            widget: "list"
            hint: "כל סוג הדפסה (נייר, קנבס, וכל מה שתוסיפו בעתיד) עם הגדלים והמחירים שלו. מזהה הסוג (id) חייב להתאים למה שנבחר ב'סוגי הדפסה נוספים' בכל יצירה"
            fields:
              - { label: "מזהה (אנגלית, ללא רווחים - למשל paper, canvas)", name: "id", widget: "string" }
              - { label: "שם הסוג", name: "name", widget: "string" }
              - { label: "תיאור קצר (מוצג בכרטיס הבחירה)", name: "description", widget: "string" }
              - { label: "הערת מחירון", name: "note", widget: "text" }
              - name: "sizes"
                label: "גדלים ומחירים"
                widget: "list"
                fields:
                  - { label: "מזהה (אנגלית, ללא רווחים)", name: "id", widget: "string" }
                  - { label: "גודל באינץ'", name: "labelIn", widget: "string" }
                  - { label: "גודל בס\"מ", name: "labelCm", widget: "string" }
