backend:
  name: github
  repo: galdisegniart/disegni-studio
  branch: main
  base_url: https://disegni-cms-oauth.galdisegniart.workers.dev

local_backend: true

i18n:
  structure: single_file
  locales: [he, en]
  default_locale: he

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "artworks"
    label: "יצירות אמנות (גלריה)"
    folder: "src/content/artworks"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.slug}}"
    identifier_field: "name"
    summary: "{{name}} ({{galleryMedium}})"
    i18n: true
    fields:
      - { label: "מזהה בכתובת (אנגלית, ללא רווחים)", name: "slug", widget: "string", hint: "משמש בכתובת /products/<מזהה>/ - לא לשנות אחרי הפרסום" }
      - { label: "סדר הופעה בגלריה", name: "order", widget: "number" }
      - { label: "שם היצירה", name: "name", widget: "string", i18n: true }
      - { label: "קטגוריה (טכניקה)", name: "category", widget: "string", hint: "הקלידו באנגלית, ללא רווחים (למשל pastel, mixed, acrylic, drawing, oil, digital). חייב להתאים בדיוק לערך (value) של אחד מכפתורי הסינון בעמוד 'הדפסים' (תוכן החנות > הדפסים) - אחרת היצירה לא תופיע כשמסננים לפי אותה קטגוריה." }
      - { label: "טכניקה (מוצג בגלריה ובחנות)", name: "galleryMedium", widget: "string", i18n: true }
      - { label: "טכניקה (מוצג בעמוד היצירה)", name: "detailMedium", widget: "string", i18n: true }
      - { label: "תיאור היצירה", name: "description", widget: "text", i18n: true }
      - { label: "טקסט חלופי לתמונה (נגישות)", name: "alt", widget: "string", i18n: true }
      - { label: "תמונה בגודל מלא", name: "image", widget: "image" }
      - { label: "תמונה ממוזערת (גלריה)", name: "thumb", widget: "image" }
      - label: "תמונות נוספות בעמוד המוצר"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "תמונה", name: "image", widget: "image" }
          - { label: "תמונה ממוזערת (אופציונלי)", name: "thumb", widget: "image", required: false }
          - { label: "טקסט חלופי לתמונה", name: "alt", widget: "string" }
          - { label: "סוג מוצר מקושר (אופציונלי)", name: "productType", widget: "select", required: false, options: [{ label: "פוסטר", value: "poster" }, { label: "קנבס מתוח", value: "canvas" }, { label: "פוסטר ממוסגר", value: "framed-print" }] }
          - { label: "מידה מקושרת באינץ' (אופציונלי, לדוגמה 12x16)", name: "sizeId", widget: "string", required: false }
          - { label: "צבע מסגרת (אופציונלי)", name: "frameColor", widget: "select", required: false, options: [{ label: "שחור", value: "black" }, { label: "לבן", value: "white" }, { label: "עץ", value: "wood" }] }
      - { label: "היצירה המקורית זמינה למכירה?", name: "originalAvailable", widget: "boolean", default: false, hint: "סמנו רק אם המקור עדיין לא נמכר ואתם רוצים למכור אותו" }
      - { label: "מחיר היצירה המקורית (₪)", name: "originalPrice", widget: "number", default: 0, hint: "רלוונטי רק אם סימנתם 'זמינה למכירה' למעלה" }
      - name: "handEmbellished"
        label: "הדפס בעיטור ידני (אופציונלי)"
        widget: "object"
        required: false
        fields:
          - { label: "מוצע ליצירה הזו?", name: "available", widget: "boolean", default: false }
          - { label: "מחיר (₪)", name: "price", widget: "number", required: false }
          - { label: "תיאור הגודל (למשל '16×20 קנבס מתוח')", name: "sizeLabel", widget: "string", required: false }
      - name: "story"
        label: "הסיפור מאחורי היצירה (אופציונלי, השאירו ריק כדי לא להציג)"
        widget: "object"
        required: false
        i18n: true
        fields:
          - { label: "כותרת", name: "heading", widget: "string", required: false }
          - { label: "פסקאות", name: "paragraphs", widget: "list", required: false, field: { label: "פסקה", name: "text", widget: "text" } }
      - name: "experience"
        label: "החוויה שהיצירה פותחת (אופציונלי, השאירו ריק כדי לא להציג)"
        widget: "object"
        required: false
        i18n: true
        fields:
          - { label: "כותרת", name: "heading", widget: "string", required: false }
          - { label: "פסקאות", name: "paragraphs", widget: "list", required: false, field: { label: "פסקה", name: "text", widget: "text" } }
      - name: "testimony"
        label: "עדות על היצירה (אופציונלי, השאירו ריק כדי לא להציג)"
        widget: "object"
        required: false
        i18n: true
        fields:
          - { label: "כותרת", name: "heading", widget: "string", required: false }
          - { label: "טקסט העדות", name: "text", widget: "text", required: false }
          - name: "video"
            label: "סרטון (אופציונלי)"
            widget: "object"
            required: false
            fields:
              - { label: "קובץ וידאו", name: "file", widget: "file", required: false, hint: "העלו קובץ mp4" }
              - { label: "תמונת שער לסרטון (אופציונלי)", name: "poster", widget: "image", required: false }
              - { label: "כיתוב (אופציונלי)", name: "caption", widget: "string", required: false }
      - label: "סוגי הדפסה נוספים (חוץ מנייר, שזמין תמיד)"
        name: "extraMaterials"
        widget: "select"
        multiple: true
        required: false
        default: []
        hint: "סמנו רק אחרי שהוספתם את היצירה כמוצר מתאים בפרינטפול, אחרת ההזמנה לא תעבוד"
        options:
          - { label: "קנבס מתוח", value: "canvas" }
          - { label: "פוסטר ממוסגר", value: "framed-print" }
      - label: "וריאנטים מאושרים לתשלום מקוון (Grow)"
        name: "purchaseVariants"
        widget: "list"
        required: false
        default: []
        hint: "כל שורה כאן = גודל/חומר אחד שאפשר לשלם עליו דרך הכפתור האוטומטי בעגלה. אפשר למלא את זה ידנית, אבל הכי מהיר להריץ קודם 'node scripts/generate-purchase-variants.js <slug>' - זה ממלא טיוטה אוטומטית מהמחירון הרגיל ומהקטלוג של פרינטפול, ואז רק לבדוק/לתקן כאן."
        fields:
          - { label: "סוג מוצר", name: "productType", widget: "select", options: [{ label: "פוסטר", value: "poster" }, { label: "קנבס מתוח", value: "canvas" }, { label: "פוסטר ממוסגר", value: "framed-print" }] }
          - { label: "מידה (למשל 12x16, כמו בפרינטפול)", name: "sizeId", widget: "string" }
          - { label: "מספר קטלוג (מפרינטפול)", name: "catalogNumber", widget: "string" }
          - { label: "מחיר ש\"ח", name: "priceILS", widget: "number" }
          - { label: "תווית גודל באינץ'", name: "labelIn", widget: "string", required: false }
          - { label: "תווית גודל בס\"מ", name: "labelCm", widget: "string", required: false }
          - { label: "משלוח פריט ראשון (ש\"ח, אופציונלי - אם ריק נלקח מהטבלה הכללית)", name: "shippingFirstILS", widget: "number", required: false }
          - { label: "משלוח פריט נוסף (ש\"ח, אופציונלי)", name: "shippingAdditionalILS", widget: "number", required: false }

  - name: "workshops"
    label: "סדנאות"
    folder: "src/content/workshops"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.slug}}"
    identifier_field: "cardTitle"
    summary: "{{cardTitle}}"
    i18n: true
    fields:
      - { label: "מזהה בכתובת (אנגלית, ללא רווחים)", name: "slug", widget: "string", hint: "משמש בכתובת /workshops/<מזהה>/ - לא לשנות אחרי הפרסום" }
      - { label: "סדר הופעה", name: "order", widget: "number" }
      - { label: "כותרת קצרה בכרטיס", name: "cardLabel", widget: "string", i18n: true }
      - { label: "שם הסדנה בכרטיס", name: "cardTitle", widget: "string", i18n: true }
      - { label: "תמונת כרטיס", name: "cardImage", widget: "image" }
      - { label: "טקסט חלופי לתמונת כרטיס", name: "cardImageAlt", widget: "string", i18n: true }
      - { label: "מיקום התמונה בכרטיס (בעמוד רשימת הסדנאות)", name: "cardImagePosition", widget: "string", required: false, hint: "לדוגמה: center, center 20%, center top, left center - שולט מה נשאר בפריים כשהתמונה נחתכת" }
      - { label: "משפט קצר: למי הסדנה מתאימה (מוצג בעמוד רשימת הסדנאות)", name: "personaLine", widget: "string", required: false, i18n: true }
      - { label: "כותרת הדפדפן (title)", name: "title", widget: "string", i18n: true }
      - { label: "תיאור למנועי חיפוש", name: "metaDescription", widget: "text", i18n: true }
      - { label: "כיתוב קטן מעל הכותרת", name: "eyebrow", widget: "string", i18n: true }
      - { label: "כותרת ראשית", name: "heading", widget: "string", i18n: true }
      - { label: "טקסט פתיחה", name: "lead", widget: "text", i18n: true }
      - { label: "מחיר החל מ- (₪, מספר בלבד - לשימוש בנתונים מובנים ל-Google)", name: "priceFromILS", widget: "number" }
      - name: "quickMeta"
        label: "פרטים מהירים (4 שדות)"
        widget: "list"
        i18n: true
        fields:
          - { label: "תווית", name: "label", widget: "string" }
          - { label: "ערך", name: "value", widget: "string" }
      - { label: "טקסט כפתור פעולה ראשי", name: "heroCtaLabel", widget: "string", i18n: true }
      - name: "recurringAvailability"
        label: "זמינות שבועית קבועה ליומן קביעת תור (אם ריק, הכפתורים יפתחו WhatsApp ישירות במקום יומן)"
        widget: "list"
        required: false
        summary: "{{fields.weekday}} · {{time}}"
        fields:
          - { label: "יום בשבוע", name: "weekday", widget: "select", options: [
                { label: "ראשון", value: "0" },
                { label: "שני", value: "1" },
                { label: "שלישי", value: "2" },
                { label: "רביעי", value: "3" },
                { label: "חמישי", value: "4" },
                { label: "שישי", value: "5" },
                { label: "שבת", value: "6" }
              ] }
          - { label: "שעה", name: "time", widget: "string", hint: "לדוגמה: 16:00–17:30" }
      - { label: "כמה שבועות קדימה להציג ביומן", name: "bookingWindowWeeks", widget: "number", default: 8, required: false }
      - { label: "הודעת WhatsApp (כפתור ראשי)", name: "waMessage", widget: "text", i18n: true }
      - { label: "תמונה ראשית", name: "heroImage", widget: "image" }
      - { label: "טקסט חלופי לתמונה ראשית", name: "heroImageAlt", widget: "string", i18n: true }
      - { label: "יש ביקורות אמיתיות?", name: "hasReviews", widget: "boolean", default: false }
      - { label: "ציטוט קצר לתקציר ביקורת (אם יש ביקורות)", name: "reviewPeekExcerpt", widget: "string", required: false }
      - name: "story"
        label: "סקציית הסיפור"
        widget: "object"
        i18n: true
        fields:
          - { label: "כיתוב קטן", name: "eyebrow", widget: "string" }
          - { label: "כותרת (אפשר <br> לשבירת שורה)", name: "heading", widget: "string" }
          - { label: "פסקת פתיחה מודגשת", name: "lead", widget: "string" }
          - { label: "פסקאות נוספות", name: "paragraphs", widget: "list", field: { label: "פסקה", name: "text", widget: "text" } }
      - name: "video"
        label: "סקציית וידאו (השאירו ריק אם אין)"
        widget: "object"
        required: false
        i18n: true
        fields:
          - { label: "כיתוב קטן", name: "eyebrow", widget: "string" }
          - { label: "כותרת", name: "heading", widget: "string" }
          - { label: "טקסט", name: "text", widget: "string" }
          - { label: "קובץ וידאו מקומי (השאירו ריק אם משתמשים בקישור יוטיוב/וימאו למטה)", name: "file", widget: "file", required: false }
          - { label: "או - קישור יוטיוב/וימאו (השאירו ריק אם מעלים קובץ מקומי למעלה)", name: "url", widget: "string", required: false }
          - { label: "תמונת שער", name: "poster", widget: "image" }
          - { label: "טקסט חלופי לתמונת השער", name: "posterAlt", widget: "string" }
      - name: "included"
        label: "מה כלול"
        widget: "object"
        i18n: true
        fields:
          - { label: "כיתוב קטן", name: "eyebrow", widget: "string" }
          - name: "items"
            label: "פריטים (4)"
            widget: "list"
            fields:
              - { label: "תווית", name: "label", widget: "string" }
              - { label: "כותרת", name: "title", widget: "string" }
              - { label: "טקסט", name: "text", widget: "text" }
      - name: "pricing"
        label: "מחירים"
        widget: "object"
        i18n: true
        fields:
          - { label: "כיתוב קטן", name: "eyebrow", widget: "string" }
          - { label: "כותרת", name: "heading", widget: "string" }
          - { label: "הערה", name: "note", widget: "text" }
          - name: "tiers"
            label: "שורות מחיר"
            widget: "list"
            fields:
              - { label: "תווית", name: "label", widget: "string" }
              - { label: "מחיר", name: "value", widget: "string" }
              - { label: "כמות משתתפים (למילוי רק אם המחיר תלוי בכמות - מפעיל בורר כמות ביומן קביעת מועד)", name: "count", widget: "number", required: false }
          - { label: "טקסט כפתור", name: "ctaLabel", widget: "string" }
      - name: "gallery"
        label: "גלריית תמונות (השאירו ריק אם אין)"
        widget: "object"
        required: false
        i18n: true
        fields:
          - { label: "כיתוב קטן", name: "eyebrow", widget: "string" }
          - { label: "טקסט כפתור הרחבה (ריק = בלי הרחבה)", name: "expandLabel", widget: "string", required: false }
          - name: "images"
            label: "תמונות"
            widget: "list"
            fields:
              - { label: "תמונה", name: "src", widget: "image" }
              - { label: "טקסט חלופי", name: "alt", widget: "string" }
              - { label: "תמונה רחבה (רק לתמונה ראשונה)", name: "wide", widget: "boolean", required: false, default: false }
      - name: "reviewsHeading"
        label: "כותרת סקציית הביקורות"
        widget: "object"
        i18n: true
        fields:
          - { label: "כיתוב קטן", name: "eyebrow", widget: "string" }
          - { label: "כותרת", name: "heading", widget: "string" }
      - name: "reviewsSummary"
        label: "סיכום דירוג (רק אם יש ביקורות)"
        widget: "object"
        required: false
        i18n: true
        fields:
          - { label: "ציון", name: "score", widget: "string" }
          - { label: "טקסט כמות", name: "countLabel", widget: "string" }
      - { label: "טקסט כשאין ביקורות עדיין", name: "reviewsEmptyText", widget: "string", required: false, i18n: true }
      - name: "reviews"
        label: "ביקורות"
        widget: "list"
        required: false
        fields:
          - { label: "שם", name: "name", widget: "string" }
          - { label: "תאריך (YYYY-MM-DD)", name: "date", widget: "string" }
          - { label: "תאריך לתצוגה", name: "dateLabel", widget: "string" }
          - { label: "תקציר", name: "excerpt", widget: "string" }
          - { label: "ביקורת מלאה", name: "full", widget: "text" }
      - { label: "כיתוב קטן (סיום)", name: "finalEyebrow", widget: "string", i18n: true }
      - { label: "כותרת סיום", name: "finalHeading", widget: "string", i18n: true }
      - { label: "טקסט כפתור סיום", name: "finalCtaLabel", widget: "string", i18n: true }
      - { label: "הודעת WhatsApp (כפתור סיום)", name: "finalWaMessage", widget: "text", i18n: true }

  - name: "apparel"
    label: "בגדים ואביזרים (חנות)"
    folder: "src/content/apparel"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.slug}}"
    identifier_field: "name"
    summary: "{{name}} ({{category}})"
    i18n: true
    fields:
      - { label: "מזהה בכתובת (אנגלית, ללא רווחים)", name: "slug", widget: "string", hint: "משמש בכתובת /shop/<מזהה>/ - לא לשנות אחרי הפרסום. אפשר להשתמש באותו שם עיצוב שיש כבר בהדפסים (למשל seed-of-joy) בלי התנגשות, כי החנות נמצאת בנתיב נפרד." }
      - { label: "סדר הופעה בקטלוג", name: "order", widget: "number" }
      - { label: "שם המוצר (מוצג באתר)", name: "name", widget: "string", i18n: true }
      - { label: "טקסט התאמה לפרינטפול (אנגלית בלבד)", name: "matchName", widget: "string", required: false, hint: "אופציונלי - אם ריק, המערכת תשתמש ב'שם המוצר' כדי לזהות את המוצר בפרינטפול. אם 'שם המוצר' בעברית או שונה משם המוצר בפרינטפול, מלאו כאן קטע ייחודי מתוך שם המוצר בפרינטפול באנגלית (למשל 'Muscle Shirt') - כדי שההתאמה האוטומטית תמצא רק את המוצר הזה ולא מוצרים אחרים עם עיצוב דומה." }
      - { label: "קטגוריה", name: "category", widget: "select", options: [{ label: "יוניסקס", value: "unisex" }, { label: "נשים", value: "women" }, { label: "גברים", value: "men" }, { label: "מדבקות", value: "stickers" }] }
      - { label: "תיאור המוצר", name: "description", widget: "text", i18n: true }
      - { label: "טקסט חלופי לתמונה (נגישות)", name: "alt", widget: "string", i18n: true }
      - { label: "תמונה ראשית", name: "image", widget: "image" }
      - { label: "תמונה ממוזערת (קטלוג)", name: "thumb", widget: "image" }
      - label: "תמונות נוספות בעמוד המוצר"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "תמונה", name: "image", widget: "image" }
          - { label: "טקסט חלופי לתמונה", name: "alt", widget: "string" }
      - label: "וריאנטים (מידות/צבעים) מאושרים לתשלום מקוון (Grow)"
        name: "purchaseVariants"
        widget: "list"
        required: false
        default: []
